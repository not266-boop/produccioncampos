# Perfil de produccion: --spring.profiles.active=prod
# Requiere la variable de entorno JWT_SECRET (no hay valor por defecto)

# Hibernate no modifica el esquema: solo valida que coincide con las entidades
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Sin usuarios de prueba
app.seed-users=false

# Documentacion de la API desactivada en produccion
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
