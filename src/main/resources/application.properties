spring.application.name=produccioncampos
spring.datasource.url=jdbc:sqlite:produccioncampos.db
spring.datasource.driver-class-name=org.sqlite.JDBC

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=20

# El secreto JWT llega por variable de entorno; en desarrollo lo da el perfil dev
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=3600000

cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:4200}

# Usuarios de prueba desactivados por defecto (solo perfil dev)
app.seed-users=false
app.login.max-attempts=5
app.login.lock-minutes=15

# Limites de paginacion
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=50
